name: Run Lint Checks

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run Lint Checks
        run: |
          pnpm lint:ci
  type-check:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run Type Checks
        run: |
          pnpm typecheck
  types-resolution-check:
    runs-on: ubuntu-latest
    name: Published Types Resolution
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify published types resolve under node10/node16/bundler
        # attw runs npm pack; inspect the setup build without running prepare again.
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          pnpm check:types-resolution
