name: FOSSA Scans

on:
  workflow_call:

jobs:
    fossa-scan:
        runs-on: ubuntu-latest
        steps:
          - name: "Checkout Code"
            uses: actions/checkout@v7

          - name: "Run FOSSA Scan"
            uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
            with:
              api-key: ${{secrets.FOSSAAPIKEY}}
              debug: true

          - name: "FOSSA Tests"
            id: fossa-tests
            uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
            with:
              api-key: ${{secrets.FOSSAAPIKEY}}
              run-tests: true
