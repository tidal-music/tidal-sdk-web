name: Generate API Types and Create PR

on:
  workflow_dispatch:
    inputs:
      use_downloaded_spec:
        description: 'Whether to use the downloaded spec from the artifacts'
        required: false
        type: string
        default: 'false'
  workflow_call:
    inputs:
      use_downloaded_spec:
        description: 'Whether to use the downloaded spec from the artifacts'
        required: false
        type: string
        default: 'false'
    secrets:
      token:
        description: >-
          Token for a user with write access to the repo (tidal-tools' ACTIONS_PAT).
          It approves the API PR and turns on auto-merge, so the PR merges once the required checks pass.
          Without it, the PR is opened as before and needs a human to approve and merge it.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-api:
    runs-on: ubuntu-latest
    env:
      API_FOLDER: packages/api
      GENERATED_FILE: src/allAPI.generated.ts
      SPEC_FILE: bin/tidal-api-oas.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: |
          pnpm install
      - name: Check for existing PR
        id: check_pr
        uses: ./.github/actions/check-api-pr

      - name: Checkout PR branch if exists
        if: steps.check_pr.outputs.existing_pr == 'true'
        env:
          PR_BRANCH: ${{ steps.check_pr.outputs.pr_branch }}
        run: |
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"
          echo "Using existing PR branch: $PR_BRANCH"

      - name: Download API spec artifact
        if: ${{ inputs.use_downloaded_spec == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: api-spec
          path: /tmp/api-check
      - name: Generate API types
        env:
          USE_DOWNLOADED_SPEC: ${{ inputs.use_downloaded_spec }}
        run: |
          cd "$API_FOLDER"
          mkdir -p bin

          if [ "$USE_DOWNLOADED_SPEC" == "true" ] && [ -f "/tmp/api-check/latest-api.json" ]; then
            echo "Using downloaded API spec"
            cp /tmp/api-check/latest-api.json "$SPEC_FILE"
          else
            echo "Downloading API spec as part of generation"
            curl -s https://tidal-music.github.io/tidal-api-reference/tidal-api-oas.json -o "$SPEC_FILE"
          fi
          pnpm run generateTypes "$SPEC_FILE" --output-file "$GENERATED_FILE"

      - name: Check for changes
        id: check_for_changes
        run: |
          cd "$API_FOLDER"
          git add "$GENERATED_FILE" "$SPEC_FILE"
          changes_in_generated=$(git status -s "$GENERATED_FILE" | sed 's/"//g')
          changes_in_spec=$(git status -s "$SPEC_FILE" | sed 's/"//g')

          echo "Changes in $GENERATED_FILE:"
          echo "$changes_in_generated"
          echo "Changes in $SPEC_FILE:"
          echo "$changes_in_spec"

          SPEC_VERSION=$(jq -r '.info.version // empty' "$SPEC_FILE" 2>/dev/null)
          if [ -z "$SPEC_VERSION" ]; then
            SPEC_VERSION="unknown"
          fi
          echo "API Spec Version: $SPEC_VERSION"

          if [ -n "$changes_in_generated" ] || [ -n "$changes_in_spec" ]; then
            changes_detected="true"
            changed_file_count=0
            if [ -n "$changes_in_generated" ]; then
              changed_file_count=$((changed_file_count + 1))
            fi
            if [ -n "$changes_in_spec" ]; then
              changed_file_count=$((changed_file_count + 1))
            fi
          else
            changes_detected="false"
            changed_file_count=0
            echo "No changes detected in generated files."
          fi

          {
            echo 'CHANGES_IN_GENERATED<<EOF'
            echo "$changes_in_generated"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'CHANGES_IN_SPEC<<EOF'
            echo "$changes_in_spec"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          echo "CHANGES_DETECTED=$changes_detected" >> $GITHUB_OUTPUT
          echo "CHANGED_FILE_COUNT=$changed_file_count" >> $GITHUB_OUTPUT
          echo "SPEC_VERSION=$SPEC_VERSION" >> $GITHUB_OUTPUT

      - name: No Changes Found - Say Goodbye
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'false' }}
        run: |
            echo "No changes found after generation. Good bye"

      - name: Bump version and update changelog
        id: bump_version
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' }}
        env:
          SPEC_VERSION: ${{ steps.check_for_changes.outputs.SPEC_VERSION }}
        run: |
          cd "$API_FOLDER"

          MAIN_VERSION=$(git show main:$API_FOLDER/package.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          CURRENT_VERSION=$(jq -r '.version' package.json)

          if [ -n "$MAIN_VERSION" ] && [ "$MAIN_VERSION" == "$CURRENT_VERSION" ]; then
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            NEW_VERSION="$major.$((minor + 1)).0"
            echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"
          else
            NEW_VERSION="$CURRENT_VERSION"
            echo "Version already bumped: $NEW_VERSION (main: $MAIN_VERSION)"
          fi

          tmp=$(mktemp)
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json

          # Describe what changed in the spec since the last release (the spec on main),
          # so the changelog and release notes say more than "synced". The script is read
          # from main because an older PR branch may not have it yet.
          CHANGES_FILE="$RUNNER_TEMP/api-changes.md"
          BASE_SPEC="$RUNNER_TEMP/base-spec.json"
          CHANGELOG_SCRIPT="$RUNNER_TEMP/api_spec_changelog.py"
          if git show "main:$API_FOLDER/$SPEC_FILE" > "$BASE_SPEC" 2>/dev/null \
            && git show "main:.github/scripts/api_spec_changelog.py" > "$CHANGELOG_SCRIPT" 2>/dev/null \
            && python3 -I "$CHANGELOG_SCRIPT" "$BASE_SPEC" "$SPEC_FILE" > "$CHANGES_FILE"; then
            echo "Generated changelog from spec diff"
          else
            echo "Could not diff against the spec on main - using a generic changelog entry"
            printf '### Changed\n\n- Sync to new API definitions (version: %s)\n' "$SPEC_VERSION" > "$CHANGES_FILE"
          fi
          cat "$CHANGES_FILE"

          export NEW_VERSION CHANGES_FILE
          python3 << 'PYEOF'
          import os, re
          from datetime import date

          version = os.environ['NEW_VERSION']
          today = date.today().isoformat()

          with open(os.environ['CHANGES_FILE']) as f:
              changes = f.read().strip()

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          entry = f"## [{version}] - {today}\n\n{changes}"

          # Replace the entry for this version if the open PR already added one, otherwise
          # insert it above the newest entry. Use functions as replacements so backslashes
          # in the generated text are not treated as escapes.
          pattern = re.compile(rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## \[|$)')
          if pattern.search(content):
              content = pattern.sub(lambda _: entry + "\n", content, count=1)
          else:
              content = re.sub(r'## \[', lambda m: entry + '\n\n' + m.group(0), content, count=1)

          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          PYEOF

          {
            echo 'CHANGES<<EOF_CHANGES'
            cat "$CHANGES_FILE"
            echo 'EOF_CHANGES'
          } >> "$GITHUB_OUTPUT"

          echo "Updated to version $NEW_VERSION with API spec $SPEC_VERSION"

      - name: Prepare git and define a branch name
        id: prepare_git_and_define_branch_name
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' }}
        run: |
          git config user.email "svc-github-tidal-music-tools@block.xyz"
          git config user.name "TIDAL Music Tools"

          # Use a consistent branch name for API updates, so we can edit the PR later
          standard_branch_name="tidal-music-tools/auto-update-tidal-api"

          echo "BRANCH_NAME=$standard_branch_name" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit_changes
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' }}
        env:
          SPEC_VERSION: ${{ steps.check_for_changes.outputs.SPEC_VERSION }}
          CHANGED_FILE_COUNT: ${{ steps.check_for_changes.outputs.CHANGED_FILE_COUNT }}
          CHANGES_IN_GENERATED: ${{ steps.check_for_changes.outputs.CHANGES_IN_GENERATED }}
          CHANGES_IN_SPEC: ${{ steps.check_for_changes.outputs.CHANGES_IN_SPEC }}
          EXISTING_PR: ${{ steps.check_pr.outputs.existing_pr }}
          PR_BRANCH: ${{ steps.check_pr.outputs.pr_branch }}
        run: |
          commit_title="Update Tidal API to v${SPEC_VERSION} - ${CHANGED_FILE_COUNT} files changed"

          commit_body="Changes in generated file:\n${CHANGES_IN_GENERATED}\n\nChanges in spec file:\n${CHANGES_IN_SPEC}"
          commit_body=$(echo -e "$commit_body")

          git add "$API_FOLDER/$GENERATED_FILE" "$API_FOLDER/$SPEC_FILE" "$API_FOLDER/package.json" "$API_FOLDER/CHANGELOG.md"

          standard_branch_name="tidal-music-tools/auto-update-tidal-api"

          if [ "$EXISTING_PR" == "true" ]; then
            branch_name="$PR_BRANCH"

            if git diff --cached --quiet; then
              echo "No new changes compared to existing PR branch - skipping update"
              echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
              echo "commit_made=false" >> $GITHUB_OUTPUT
            else
              echo "Changes detected compared to existing PR branch - updating"
              git commit -m "$commit_title"$'\n\n'"$commit_body"
              echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
              echo "commit_made=true" >> $GITHUB_OUTPUT
            fi
          else
            git checkout -b "$standard_branch_name"
            git commit -m "$commit_title"$'\n\n'"$commit_body"
            branch_name="$standard_branch_name"
            echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
            echo "commit_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' && steps.commit_changes.outputs.commit_made == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.commit_changes.outputs.branch_name }}
        run: |
          if git ls-remote --exit-code origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch exists - force pushing changes to: $BRANCH_NAME"
            git push origin HEAD:"$BRANCH_NAME" --force
          else
            echo "Creating new branch: $BRANCH_NAME"
            git push --set-upstream origin "$BRANCH_NAME"
          fi

      - name: Create or Update Pull Request
        id: create_pr
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' && steps.commit_changes.outputs.commit_made == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_VERSION: ${{ steps.check_for_changes.outputs.SPEC_VERSION }}
          CHANGED_FILE_COUNT: ${{ steps.check_for_changes.outputs.CHANGED_FILE_COUNT }}
          CHANGES_IN_GENERATED: ${{ steps.check_for_changes.outputs.CHANGES_IN_GENERATED }}
          CHANGES_IN_SPEC: ${{ steps.check_for_changes.outputs.CHANGES_IN_SPEC }}
          API_CHANGES: ${{ steps.bump_version.outputs.CHANGES }}
          EXISTING_PR: ${{ steps.check_pr.outputs.existing_pr }}
          PR_NUMBER: ${{ steps.check_pr.outputs.pr_number }}
          PR_HEAD_BRANCH: ${{ steps.prepare_git_and_define_branch_name.outputs.BRANCH_NAME }}
          REPO: ${{ github.repository }}
        run: |
          current_date=$(date)
          pr_title="Automatic Tidal API module update to v${SPEC_VERSION} - ${CHANGED_FILE_COUNT} files changed"

          pr_body="Updated Tidal API to version **v${SPEC_VERSION}**\n\n**Changes in Generated file:**\n\n${CHANGES_IN_GENERATED}\n\n**Changes in Spec file:**\n\n${CHANGES_IN_SPEC}\n\nAutomatically generated on $current_date\n\nThis PR is automatically updated when API changes are detected. It merges automatically once the required checks pass, and the release is then published to npm."
          pr_body=$(echo -e "$pr_body")
          # Appended after echo -e so backslashes in the changelog text are kept as written.
          pr_body="${pr_body}"$'\n\n## Changelog entry\n\n'"${API_CHANGES}"

          pr_data="$RUNNER_TEMP/pr-data.json"
          pr_response="$RUNNER_TEMP/pr-response.json"
          if [ "$EXISTING_PR" == "true" ]; then
            method=PATCH
            endpoint="repos/${REPO}/pulls/${PR_NUMBER}"
            jq -n --arg title "$pr_title" --arg body "$pr_body" \
              '{title: $title, body: $body}' > "$pr_data"
          else
            method=POST
            endpoint="repos/${REPO}/pulls"
            jq -n --arg title "$pr_title" --arg head "$PR_HEAD_BRANCH" --arg base "main" --arg body "$pr_body" \
              '{title: $title, head: $head, base: $base, body: $body}' > "$pr_data"
          fi

          # gh api exits non-zero on an HTTP error and prints GitHub's message. Retry once
          # because a transient failure here would leave a pushed branch without a PR.
          for attempt in 1 2; do
            if gh api --method "$method" "$endpoint" --input "$pr_data" > "$pr_response"; then
              break
            fi
            echo "::warning::$method $endpoint failed (attempt $attempt): $(cat "$pr_response")"
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

          pr_number=$(jq -r '.number // empty' "$pr_response")
          if [ -z "$pr_number" ]; then
            echo "::error::No PR number in the response: $(cat "$pr_response")"
            exit 1
          fi
          echo "PR #${pr_number}: $(jq -r '.html_url' "$pr_response")"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Approve, enable auto-merge and start checks
        # The PR is opened by github-actions[bot], which can't approve its own PR, so a second
        # identity approves it. Auto-merge is enabled with that identity too: a merge done with
        # GITHUB_TOKEN would not start the release workflows on main.
        if: ${{ steps.check_for_changes.outputs.CHANGES_DETECTED == 'true' && steps.commit_changes.outputs.commit_made == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          REQUIRED_TEST_CHECK: Run Unit Tests / Run Unit Tests
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No token for auto-merge configured - PR #${PR_NUMBER} needs a manual approval and merge."
            exit 0
          fi

          # Without required checks, auto-merge would merge as soon as the PR is approved,
          # before tests have run. Only turn it on when main requires the unit tests to pass.
          required_checks=$(gh api "repos/$GH_REPO/branches/main" --jq '.protection.required_status_checks.contexts // [] | .[]')
          if ! grep -qx "$REQUIRED_TEST_CHECK" <<< "$required_checks"; then
            echo "::warning::'$REQUIRED_TEST_CHECK' is not a required status check on main, so auto-merge stays off. PR #${PR_NUMBER} needs a manual approval and merge."
            exit 0
          fi

          gh pr review "$PR_NUMBER" --approve --body "Generated from the published TIDAL API spec. Approved automatically; it merges once the required checks pass."
          gh pr merge "$PR_NUMBER" --auto --squash

          # GitHub doesn't start pull_request workflows for a push or PR made with GITHUB_TOKEN:
          # the run is created as action_required, with no jobs, so the required checks never
          # report and auto-merge waits forever. A re-run by a user with write access starts it.
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          for attempt in $(seq 1 12); do
            run_ids=$(gh api "repos/$GH_REPO/actions/runs?head_sha=${head_sha}&event=pull_request" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
            [ -n "$run_ids" ] && break
            sleep 5
          done
          if [ -z "$run_ids" ]; then
            echo "No pull_request runs waiting for approval on ${head_sha}."
            exit 0
          fi
          for run_id in $run_ids; do
            echo "Starting pull_request run ${run_id} for ${head_sha}"
            gh run rerun "$run_id"
          done
