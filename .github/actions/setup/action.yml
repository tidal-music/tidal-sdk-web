name: Setup repo and pnpm
description: Installs dependencies and builds workspace packages through their prepare scripts
runs:
  using: composite
  steps:
    # https://pnpm.io/continuous-integration
    - name: Install package manager
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        install: false
    - name: Set up Node.js w/ version from .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
    # Workspace prepare scripts build packages in dependency order during install.
    # Callers can use the generated JavaScript and declarations without rebuilding.
    - name: Install dependencies and build workspace packages
      shell: bash
      run: pnpm install --frozen-lockfile
